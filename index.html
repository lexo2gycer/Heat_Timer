<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma séance sport</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead6;--ink:#2b2218;--muted:#6f6350;--card:#fffaf0;--line:#dccfb0;--gold:#9a6f0b;--work:#b3261e;--rest:#2f6f5e;--prep:#8d6a10;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d0b;--ink:#f4ead2;--muted:#a79d86;--card:#1a1814;--line:#3a3427;--gold:#e0b04a;--work:#c7311f;--rest:#2f7d69;--prep:#a67c14}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:17px;transition:background .25s}
body.work{background:var(--work);color:var(--on)}
body.rest{background:var(--rest);color:var(--on)}
body.prep{background:var(--prep);color:var(--on)}
body.done{background:var(--bg);color:var(--ink)}
main{max-width:480px;margin:0 auto;padding:20px;min-height:100%;display:flex;flex-direction:column}
h1{font:800 28px 'Barlow Condensed',sans-serif;margin:8px 0 16px}
h2{font:800 20px 'Barlow Condensed',sans-serif;margin:22px 0 10px}
.row,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between}
.row small,.lbl{display:block;color:var(--muted);font-size:14px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;cursor:pointer;padding:0}
.step output{font:800 26px 'Barlow Condensed',sans-serif;min-width:48px;text-align:center}
.head{display:flex;gap:8px;margin-bottom:10px}
.head input{flex:1;min-width:0;font:600 18px Barlow,sans-serif;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.head button{border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.grid .step{justify-content:center;gap:2px}
.grid .step button{width:32px;height:32px;font-size:18px}
.grid .step output{min-width:36px;font-size:22px}
.btn{font:800 24px 'Barlow Condensed',sans-serif;border:0;border-radius:14px;padding:16px;width:100%;cursor:pointer;background:var(--ink);color:var(--bg);margin-top:10px}
.btn.ghost{background:transparent;border:2px solid currentColor;color:inherit}
.btn.add{background:transparent;border:2px dashed var(--line);color:var(--ink);padding:12px;font-size:20px;margin-top:0}
button:focus-visible,input:focus-visible{outline:3px solid currentColor;outline-offset:2px}
#run{display:none;flex:1;flex-direction:column;text-align:center}
#run.on{display:flex}
#setup.off{display:none}
.phase{font:800 clamp(30px,10vw,48px) 'Barlow Condensed',sans-serif;margin-top:3vh;letter-spacing:.02em;opacity:.85}
.name{font:800 clamp(40px,14vw,72px)/1 'Barlow Condensed',sans-serif;margin-top:6px;overflow-wrap:anywhere}
.time{font:800 clamp(130px,44vw,220px)/0.95 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;margin:auto 0}
.info{font-size:19px;margin-bottom:4px;opacity:.9}
.next{font-size:17px;margin-bottom:14px;opacity:.8;min-height:1.4em}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:currentColor}
.seg{display:flex;gap:6px;margin-bottom:14px}.seg button{flex:1;font:800 18px 'Barlow Condensed',sans-serif;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card .seg{margin-bottom:10px}.card .seg button{font-size:16px;padding:8px}
#home.off{display:none}.back{background:none;border:0;color:var(--muted);font:600 16px Barlow,sans-serif;padding:8px 0;cursor:pointer;text-align:left}.sname{width:100%;font:800 28px 'Barlow Condensed',sans-serif;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}.days{display:flex;gap:6px;margin-bottom:6px}.days button{flex:1;min-width:0;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Barlow,sans-serif;cursor:pointer}.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{margin-top:0;font-size:20px;padding:12px}.acts .btn:first-child{flex:2}.acts .btn:last-child{flex:1}.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}.card.hl{border:2px solid var(--gold)}
.blocks{flex-wrap:wrap}.blocks button{flex:1 1 28%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bn{font-size:20px;margin:6px 0 10px}
.head button.mv{text-decoration:none;font-size:20px;width:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}.head button.mv:disabled{opacity:.3}
.head2{display:flex;gap:8px;align-items:center;margin-bottom:10px}.head2 button{border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer;text-decoration:underline;margin-left:auto}.head2 button.mv{margin-left:0;text-decoration:none;font-size:20px;width:44px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}.head2 button.mv:disabled{opacity:.3}
.tag{margin:-10px 0 8px;color:var(--muted);font-weight:600;font-size:18px}
#home h1{font-family:Cinzel,Georgia,serif;letter-spacing:.04em;font-size:30px;text-align:center;color:var(--gold);margin:6px 0 16px}#home .tag{text-align:center;font-family:Cinzel,Georgia,serif}
.hero{text-align:center;color:var(--gold);margin-top:6px}.hero svg{width:min(78%,280px);height:auto}
.hello{font-weight:600;text-align:center;margin:14px 0 2px}.phrase{text-align:center;color:var(--muted);font-style:italic;margin:0 0 10px}.week{text-align:center;font-weight:600;color:var(--gold);margin:0 0 6px}
.em{font-size:26px;align-self:center}
.ringwrap{position:relative;margin:auto;width:min(70vw,300px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}.ringwrap .time{margin:0;font-size:clamp(90px,30vw,140px)}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:4}.rb{stroke:rgba(255,255,255,.25)}.rf{stroke:currentColor;stroke-linecap:round;stroke-dasharray:289}
@keyframes pu{50%{transform:scale(1.05)}}.pulse{animation:pu .5s ease-in-out infinite}
.bar{display:none}body.done .rf,body.done .time,body.done .phase{color:var(--gold);stroke:var(--gold)}body.done .time{stroke:none}
.cf{position:fixed;top:-14px;width:8px;height:14px;opacity:.9;pointer-events:none;z-index:5;animation:cf linear forwards}@keyframes cf{to{transform:translateY(105vh) rotate(720deg)}}
.load{font:800 clamp(24px,7vw,34px) 'Barlow Condensed',sans-serif;margin-top:6px;min-height:1.2em}
@media (prefers-reduced-motion:reduce){body{transition:none}.pulse{animation:none}.cf{display:none}}
</style>
</head>
<body>
<main>
<section id="home">
<div class="hero" id="hero"></div>
<h1>Ma séance sport</h1>
<p class="tag">Force et honneur !</p>
<p class="hello" id="hello"></p><p class="phrase" id="phrase"></p><p class="week" id="week"></p>
<div id="today"></div>
<h2>Mes séances</h2>
<div id="slist"></div>
<button class="btn add" id="newS">+ Nouvelle séance</button>
</section>
<section id="setup" class="off">
<button class="back" id="back">← Mes séances</button>
<input id="sname" class="sname" placeholder="Nom de la séance" aria-label="Nom de la séance" maxlength="40">
<div class="lbl" style="margin:12px 0 6px">Jours prévus</div>
<div class="days" id="days"></div>
<div class="lbl" style="margin:14px 0 6px">Blocs · un bloc = un circuit ou une suite d’exercices</div>
<div class="days blocks" id="blocks"></div>
<input id="bname" class="sname bn" placeholder="Nom du bloc (ex. Circuit A)" aria-label="Nom du bloc" maxlength="40">
<div class="seg"><button id="m-ex">Par exercice</button><button id="m-circ">Circuit (HIIT)</button></div>
<div class="row"><div><b id="pl-l">Préparation</b><small id="pl-s">avant le premier exercice</small></div><div class="step"><button data-g="prep" data-d="-5" aria-label="Moins">−</button><output id="g-prep"></output><button data-g="prep" data-d="5" aria-label="Plus">+</button></div></div>
<div class="row"><div><b id="gap-l">Pause entre exercices</b><small id="gap-s">pour changer de place</small></div><div class="step"><button data-g="gap" data-d="-5" aria-label="Moins">−</button><output id="g-gap"></output><button data-g="gap" data-d="5" aria-label="Plus">+</button></div></div>
<div class="row" id="circ-row"><div><b>Tours du circuit</b><small>tous les exercices à la suite</small></div><div class="step"><button data-c="-1" aria-label="Moins">−</button><output id="g-circ"></output><button data-c="1" aria-label="Plus">+</button></div></div>
<h2>Exercices</h2>
<div id="list"></div>
<button class="btn add" id="add">+ Ajouter un exercice</button>
<p class="lbl" id="total" style="text-align:center;margin:14px 0 0"></p>
<button class="btn" id="go">Démarrer</button>
<button class="btn alt" id="bdel">Supprimer ce bloc</button>
<button class="btn alt" id="dup">Dupliquer cette séance</button>
<button class="btn alt" id="del">Supprimer cette séance</button>
</section>
<section id="run">
<div class="phase" id="phase"></div>
<div class="name" id="name"></div>
<div class="load" id="load"></div>
<div class="ringwrap" id="rw"><svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="rb" cx="50" cy="50" r="46"/><circle class="rf" id="rf" cx="50" cy="50" r="46"/></svg><div class="time" id="time"></div></div>
<div class="info" id="info"></div>
<div class="next" id="next"></div>
<div class="bar"><i id="prog"></i></div>
<button class="btn ghost" id="skip">Passer</button>
<button class="btn ghost" id="pause">Pause</button>
<button class="btn ghost" id="stop">Arrêter</button>
</section>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var cfg={prep:10,gap:30,ex:[{n:'Pompes',w:40,r:20,k:4},{n:'Squats',w:40,r:20,k:4},{n:'Gainage',w:30,r:15,k:3}]};
try{var s=JSON.parse(localStorage.getItem('intervalle2')||'null');if(s&&Array.isArray(s.ex)&&s.ex.length)cfg=s}catch(e){}
cfg.mode=cfg.mode||'ex';cfg.circ=cfg.circ||3;
cfg.ex.forEach(function(e){e.m=e.m||'t';e.q=e.q||10});
var store={sessions:[]};
try{var st=JSON.parse(localStorage.getItem('intervalle3')||'null');if(st&&Array.isArray(st.sessions)&&st.sessions.length)store=st}catch(e){}
if(!store.sessions.length)store.sessions.push({id:Date.now(),name:'Ma séance',days:[],cfg:cfg});
function norm(c){c.prep=c.prep==null?10:c.prep;c.gap=c.gap==null?30:c.gap;c.mode=c.mode||'ex';c.circ=c.circ||3;c.ex.forEach(function(e){e.m=e.m||'t';e.q=e.q||10})}
store.sessions.forEach(function(s){s.days=s.days||[];s.blocks=s.blocks||[s.cfg];delete s.cfg;s.blocks.forEach(norm)});
var origin='home',cur=store.sessions[0],delArm=false,startedAt=0;cfg=cur.blocks[0];
function save(){try{localStorage.setItem('intervalle3',JSON.stringify(store))}catch(e){}}
function fmt(n){return n>=60?Math.floor(n/60)+':'+String(n%60).padStart(2,'0'):n+' s'}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
var lim={w:[5,600],r:[0,600],k:[1,50],q:[1,200]};
function W(e){return e.m==='r'?0:e.w}
function total(){var t=cfg.prep,n=cfg.ex.length;if(cfg.mode==='circ'){var rt=0;cfg.ex.forEach(function(e,i){rt+=W(e)+(i<n-1?e.r:0)});return t+cfg.circ*rt+(cfg.circ-1)*cfg.gap}cfg.ex.forEach(function(e,i){t+=e.k*W(e)+(e.k-1)*e.r+(i<n-1?cfg.gap:0)});return t}
function mk(tag,cls,txt){var el=document.createElement(tag);if(cls)el.className=cls;if(txt!=null)el.textContent=txt;return el}
function stepper(val,onmin,onplus,label){var d=mk('div','');d.appendChild(mk('span','lbl',label));var st=mk('div','step');
var m=mk('button','','−');m.setAttribute('aria-label','Moins');m.onclick=onmin;var o=mk('output','',val);var p=mk('button','','+');p.setAttribute('aria-label','Plus');p.onclick=onplus;
st.appendChild(m);st.appendChild(o);st.appendChild(p);d.appendChild(st);return d}
function loadFor(i,r,bk){var B=bk||cfg,e=B.ex[i],c=e.c||0,K=B.mode==='circ'?B.circ:e.k,m=e.lm||((e.cs||0)?'p':'f'),v=c;
if(m==='p')v=c+(e.cs||0)*(r-1);
else if(m==='y'){var mx=e.cm||c,pk=clamp(Math.round(e.pk||(K+1)/2),1,K);
if(r===pk)v=mx;else if(r===1||(r===K&&K>pk))v=c;else if(r<pk)v=Math.round((c+(mx-c)*(r-1)/(pk-1))/2.5)*2.5;else v=Math.round((mx-(mx-c)*(r-pk)/(K-pk))/2.5)*2.5}
return Math.max(0,Math.round(v*10)/10)}
function lrow(e,key,label,sub,min,max,unit,step){var r=mk('div','');r.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);gap:8px';
var l=mk('div','');l.appendChild(mk('b','',label));l.appendChild(mk('small','lbl',sub));r.appendChild(l);
var s=mk('div','step'),m=mk('button','','−'),p=mk('button','','+'),i=mk('input'),u=mk('span','lbl',unit||'kg');
i.type='number';i.inputMode='decimal';i.min=min;i.max=max;i.step='any';i.placeholder='0';i.value=e[key]?e[key]:'';i.setAttribute('aria-label',label);
i.style.cssText='width:76px;font:800 22px "Barlow Condensed",sans-serif;text-align:center;padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)';u.style.display='inline';
m.setAttribute('aria-label','Diminuer');p.setAttribute('aria-label','Augmenter');
i.oninput=function(){var v=parseFloat(i.value);e[key]=isNaN(v)?0:clamp(v,min,max);save()};
m.onclick=function(){e[key]=clamp(Math.round(((e[key]||0)-(step||2.5))*10)/10,min,max);save();draw()};p.onclick=function(){e[key]=clamp(Math.round(((e[key]||0)+(step||2.5))*10)/10,min,max);save();draw()};
s.appendChild(m);s.appendChild(i);s.appendChild(u);s.appendChild(p);r.appendChild(s);return r}
function draw(){
$('g-prep').textContent=fmt(cfg.prep);$('g-gap').textContent=fmt(cfg.gap);
drawBlocks();var ci=cfg.mode==='circ';$('m-ex').className=ci?'':'on';$('m-circ').className=ci?'on':'';$('circ-row').style.display=ci?'':'none';$('g-circ').textContent=cfg.circ;
$('gap-l').textContent=ci?'Pause entre les tours':'Pause entre exercices';$('gap-s').textContent=ci?'après chaque tour du circuit':'pour changer de place';
var L=$('list');L.innerHTML='';
cfg.ex.forEach(function(e,i){
var c=mk('div','card'),h=mk('div','head'),inp=mk('input');inp.value=e.n;inp.placeholder='Nom de l’exercice';inp.setAttribute('aria-label','Nom de l’exercice '+(i+1));
var h2=mk('div','head2'),em=mk('span','em',emo(e.n));h.appendChild(em);inp.oninput=function(){e.n=inp.value;em.textContent=emo(e.n);save()};h.appendChild(inp);
if(cfg.ex.length>1){[['↑',-1,'Monter'],['↓',1,'Descendre']].forEach(function(o){var j=i+o[1],b=mk('button','mv',o[0]);b.setAttribute('aria-label',o[2]+' l’exercice');b.disabled=j<0||j>=cfg.ex.length;b.onclick=function(){var t=cfg.ex[i];cfg.ex[i]=cfg.ex[j];cfg.ex[j]=t;save();draw()};h2.appendChild(b)})}
if(cfg.ex.length>1){var del=mk('button','','Supprimer');del.onclick=function(){cfg.ex.splice(i,1);save();draw()};h2.appendChild(del)}
c.appendChild(h);if(h2.childNodes.length)c.appendChild(h2);var sg=mk('div','seg');[['t','Durée'],['r','Répétitions']].forEach(function(o){var b=mk('button',e.m===o[0]?'on':'',o[1]);b.onclick=function(){e.m=o[0];save();draw()};sg.appendChild(b)});c.appendChild(sg);var g=mk('div','grid');if(cfg.mode==='circ')g.style.gridTemplateColumns='repeat(2,1fr)';
[e.m==='r'?['q','Répétitions',1]:['w','Travail',5],['r','Repos',5],['k','Tours',1]].filter(function(f){return cfg.mode==='ex'||f[0]!=='k'}).forEach(function(f){var k=f[0],st=f[2];
g.appendChild(stepper((k==='k'||k==='q')?e[k]:fmt(e[k]),function(){e[k]=clamp(e[k]-st,lim[k][0],lim[k][1]);save();draw()},function(){e[k]=clamp(e[k]+st,lim[k][0],lim[k][1]);save();draw()},f[1]))});
c.appendChild(g);var lr=mk('div','');lr.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)';
var ll=mk('div','');ll.appendChild(mk('b','','Charge de départ'));ll.appendChild(mk('small','lbl','1re série, optionnelle'));lr.appendChild(ll);
var ls=mk('div','step'),lm=mk('button','','−'),lp=mk('button','','+'),lo=mk('input'),lu=mk('span','lbl','kg');
lo.type='number';lo.inputMode='decimal';lo.min=0;lo.max=500;lo.step='any';lo.placeholder='—';lo.value=e.c>0?e.c:'';lo.setAttribute('aria-label','Charge en kilos');
lo.style.cssText='width:76px;font:800 22px "Barlow Condensed",sans-serif;text-align:center;padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)';lu.style.display='inline';
lm.setAttribute('aria-label','Moins de charge');lp.setAttribute('aria-label','Plus de charge');
lo.oninput=function(){var v=parseFloat(lo.value);e.c=isNaN(v)?0:clamp(v,0,500);save()};
lm.onclick=function(){e.c=Math.max(0,Math.round(((e.c||0)-2.5)*10)/10);save();draw()};lp.onclick=function(){e.c=Math.min(500,Math.round(((e.c||0)+2.5)*10)/10);save();draw()};
ls.appendChild(lm);ls.appendChild(lo);ls.appendChild(lu);ls.appendChild(lp);lr.appendChild(ls);c.appendChild(lr);
var lmod=e.lm||((e.cs||0)?'p':'f'),lb=mk('small','lbl','Évolution de la charge'),sg2=mk('div','seg');lb.style.marginTop='12px';sg2.style.marginTop='6px';sg2.style.marginBottom='0';
[['f','Constante'],['p','Progressive'],['y','Pyramide']].forEach(function(o){var b=mk('button',lmod===o[0]?'on':'',o[1]);b.onclick=function(){e.lm=o[0];save();draw()};sg2.appendChild(b)});
c.appendChild(lb);c.appendChild(sg2);
if(lmod==='p')c.appendChild(lrow(e,'cs','Variation par série','+ pour monter, − pour descendre',-200,200));
if(lmod==='y'){c.appendChild(lrow(e,'cm','Charge max','sommet de la pyramide',0,500));c.appendChild(lrow(e,'pk','Série du sommet','vide = au milieu',0,50,'n°',1))}
if(lmod!=='f'){var K=cfg.mode==='circ'?cfg.circ:e.k,pv=[];for(var q=1;q<=Math.min(K,30);q++)pv.push(String(loadFor(i,q)).replace('.',','));var ps=mk('small','lbl','Séries : '+pv.join(' · ')+' kg');ps.style.marginTop='8px';c.appendChild(ps)}
L.appendChild(c)});
var t=sessTotal(cur);$('total').textContent='Durée totale : '+(cur.blocks.some(function(B){return B.ex.some(function(e){return e.m==='r'})})?'au moins ':'')+Math.floor(t/60)+' min '+String(t%60).padStart(2,'0')+' s';save()}
document.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){var k=b.dataset.g;cfg[k]=clamp(cfg[k]+ +b.dataset.d,0,120);draw()}});
$('add').onclick=function(){cfg.ex.push({n:'Exercice '+(cfg.ex.length+1),w:40,r:20,k:3,m:'t',q:10});draw()};
$('m-ex').onclick=function(){cfg.mode='ex';draw()};$('m-circ').onclick=function(){cfg.mode='circ';draw()};
document.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){cfg.circ=clamp(cfg.circ+ +b.dataset.c,1,50);draw()}});
draw();

var phases=[],idx=0,left=0,end=0,paused=false,timer=null,ac=null,wl=null,lastTick=-1;
var names={prep:'Préparez-vous',work:'Travail',rest:'Repos'};
function nm(i){return cfg.ex[i].n||('Exercice '+(i+1))}
function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
var RB=[],runS=null,curB=0;
function build(){phases=[];RB=runS.blocks;RB.forEach(function(B,bi){cfg=B;var s0=phases.length;build1();for(var k=s0;k<phases.length;k++)phases[k].b=bi})}
function build1(){var n=cfg.ex.length;
var ci=cfg.mode==='circ';
if(cfg.prep>0)phases.push({t:'prep',d:cfg.prep,e:0,r:1,K:ci?cfg.circ:cfg.ex[0].k});
if(!ci){cfg.ex.forEach(function(e,i){for(var r=1;r<=e.k;r++){phases.push({t:'work',d:e.m==='r'?0:e.w,reps:e.m==='r'?e.q:0,e:i,r:r,K:e.k});
if(r<e.k&&e.r>0)phases.push({t:'rest',d:e.r,e:i,r:r,K:e.k})}
if(i<n-1&&cfg.gap>0)phases.push({t:'rest',d:cfg.gap,e:i,r:e.k,K:e.k,gap:true,nx:i+1})})}
else{for(var r=1;r<=cfg.circ;r++){cfg.ex.forEach(function(e,i){phases.push({t:'work',d:e.m==='r'?0:e.w,reps:e.m==='r'?e.q:0,e:i,r:r,K:cfg.circ});
if(i<n-1&&e.r>0)phases.push({t:'rest',d:e.r,e:i,r:r,K:cfg.circ})});
if(r<cfg.circ&&cfg.gap>0)phases.push({t:'rest',d:cfg.gap,e:n-1,r:r,K:cfg.circ,gap:true,nx:0})}}}
function enter(i){idx=i;if(i>=phases.length)return finish();var p=phases[i];cfg=RB[p.b];var e=cfg.ex[p.e],n=cfg.ex.length;
left=p.d*1000;end=Date.now()+left;lastTick=-1;document.body.className=p.t;
$('phase').textContent=p.gap?(cfg.mode==='ex'?'Changement':'Pause'):names[p.t];
var ni=p.gap?p.nx:p.e;$('name').textContent=emo(nm(ni))+' '+nm(ni);
$('info').textContent=p.gap?(cfg.mode==='ex'?'Exercice '+(p.nx+1)+' sur '+n:'Tour '+(p.r+1)+' sur '+p.K):'Tour '+p.r+' sur '+p.K+' · Exercice '+(p.e+1)+' sur '+n;
if(RB.length>1)$('info').textContent=(cfg.name||'Bloc '+(p.b+1))+' · '+$('info').textContent;var nx=phases[i+1];
$('next').textContent=!nx?'Dernier effort !':(nx.t==='work'&&(nx.b!==p.b||nx.e!==p.e)&&!p.gap?'Ensuite : '+(RB[nx.b].ex[nx.e].n||'Exercice '+(nx.e+1)):'');
if(nx&&nx.gap)$('next').textContent='Ensuite : pause, puis '+nm(nx.nx);
if(nx&&nx.b!==p.b)$('next').textContent='Ensuite : '+(RB[nx.b].name||'Bloc '+(nx.b+1));
var rp=!!p.reps;$('pause').style.display=rp?'none':'';$('skip').textContent=rp?'Terminé ✓':'Passer';$('skip').className=rp?'btn':'btn ghost';
if(rp){$('phase').textContent='Répétitions';$('time').textContent=p.reps;$('prog').style.width='0%';$('rf').style.strokeDashoffset=0;$('rw').classList.remove('pulse')}
var tp=(p.t!=='work'&&nx&&nx.t==='work')?nx:p,cx=loadFor(tp.e,tp.r,RB[tp.b]);$('load').textContent=cx>0?(p.t==='work'?'Charge : ':'Prochaine charge : ')+cx+' kg':'';
if(i>0){beep(p.t==='work'?980:660,.45);buzz(p.t==='work'?[200,80,200]:150)}render()}
function render(){var p=phases[idx];if(p.reps)return;var ms=paused?left:Math.max(0,end-Date.now()),sec=Math.ceil(ms/1000);
$('time').textContent=sec;$('prog').style.width=(100*(1-ms/(p.d*1000)))+'%';$('rf').style.strokeDashoffset=289*(1-ms/(p.d*1000));$('rw').classList.toggle('pulse',sec<=3&&sec>0&&!paused);
if(!paused&&sec<=3&&sec>0&&sec!==lastTick){lastTick=sec;beep(520,.12)}
if(!paused&&ms<=0)enter(idx+1)}
function finish(){clearInterval(timer);timer=null;document.body.className='done';$('phase').textContent='Bravo !';$('name').textContent='Séance terminée';$('load').textContent='';$('time').textContent='✓';
var n=0,mn=Math.max(1,Math.round((Date.now()-startedAt)/60000)),mx=0;
RB.forEach(function(B){n+=B.ex.length;B.ex.forEach(function(e,i){var K=B.mode==='circ'?B.circ:e.k;for(var q=1;q<=K;q++)mx=Math.max(mx,loadFor(i,q,B))})});
store.log=store.log||[];store.log.push(Date.now());save();
$('info').textContent=n+' exercice'+(n>1?'s':'')+' · '+mn+' min';
$('next').textContent='Séances cette semaine : '+weekCount()+(mx>0?' · Charge max '+mx+' kg':'');
$('prog').style.width='100%';$('rf').style.strokeDashoffset=0;$('rw').classList.remove('pulse');confetti();$('pause').style.display='none';$('skip').style.display='none';$('stop').textContent='Retour';
beep(784,.2);setTimeout(function(){beep(988,.2)},220);setTimeout(function(){beep(1175,.4)},440);buzz([300,100,300,100,500]);release()}
async function lock(){try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function release(){try{wl&&wl.release();wl=null}catch(e){}}
$('go').onclick=function(){build();paused=false;$('pause').style.display='';$('skip').style.display='';$('pause').textContent='Pause';$('stop').textContent='Arrêter';
show('none');startedAt=Date.now();$('run').classList.add('on');beep(1,.01);lock();enter(0);clearInterval(timer);timer=setInterval(render,100)};
$('skip').onclick=function(){if(timer){paused=false;$('pause').textContent='Pause';enter(idx+1)}};
$('pause').onclick=function(){if(!timer)return;if(!paused){left=Math.max(0,end-Date.now());paused=true;$('pause').textContent='Reprendre'}else{paused=false;end=Date.now()+left;$('pause').textContent='Pause'}};
$('stop').onclick=function(){clearInterval(timer);timer=null;release();document.body.className='';$('run').classList.remove('on');if(origin==='setup'){cfg=cur.blocks[curB]||cur.blocks[0];draw()}show(origin);renderHome()};
var PH=['Chaque série te rapproche de ton meilleur niveau.','La régularité bat l’intensité.','Pas à pas, charge après charge.','Aujourd’hui, tu es plus fort qu’hier.','Sois fier de chaque effort.','Une série à la fois.','La discipline fait toute la différence.'];
function logo(f,c){var d='<rect x="6" y="58" width="10" height="42" rx="3"/><rect x="18" y="66" width="8" height="26" rx="2"/><rect x="26" y="76" width="44" height="6"/><rect x="70" y="66" width="8" height="26" rx="2"/><rect x="80" y="58" width="10" height="42" rx="3"/>';
return '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="140" viewBox="0 0 300 140" role="img" aria-label="Casque de gladiateur entre deux haltères" style="fill:'+f+'"><g>'+d+'</g><g transform="translate(300,0) scale(-1,1)">'+d+'</g><path d="M108 88C108 58 126 42 150 42S192 58 192 88V106C192 112 188 116 182 116H172V100H128V116H118C112 116 108 112 108 106Z"/><path d="M120 46C128 12 172 12 180 46C168 30 132 30 120 46Z"/><rect x="122" y="76" width="56" height="9" rx="3" style="fill:'+c+'"/><rect x="145" y="76" width="10" height="30" rx="3" style="fill:'+c+'"/></svg>'}
function emo(n){n=(n||'').toLowerCase();var m=[[/d[eé]velopp|bench|press|barre|halt[eè]r|curl|traction|rowing|tirage/,'🏋️'],[/pompe|dips|triceps/,'💪'],[/squat|fente|jambe|mollet|deadlift|soulev/,'🦵'],[/cours|corde|saut|burpee|jumping|sprint|v[eé]lo|rameur/,'🏃'],[/gainage|planche|abdo|crunch|yoga|[eé]tir/,'🧘']];for(var i=0;i<m.length;i++)if(m[i][0].test(n))return m[i][1];return '💪'}
function weekCount(){var d=new Date(),m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)).getTime();return (store.log||[]).filter(function(t){return t>=m}).length}
function confetti(){try{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;var cs=['#e0b04a','#c7311f','#f4ead2','#2f7d69'];for(var i=0;i<46;i++){var d=document.createElement('i');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=cs[i%4];d.style.animationDuration=(2.2+Math.random()*2)+'s';d.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(d);setTimeout(function(x){x.remove()},5500,d)}}catch(e){}}
(function(){try{var img=new Image();img.onload=function(){var cv=document.createElement('canvas');cv.width=cv.height=180;var x=cv.getContext('2d');x.fillStyle='#0e0d0b';x.fillRect(0,0,180,180);var w=164,h=w*140/300;x.drawImage(img,8,(180-h)/2,w,h);var l=document.createElement('link');l.rel='apple-touch-icon';l.href=cv.toDataURL('image/png');document.head.appendChild(l)};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(logo('#e0b04a','#0e0d0b'))}catch(e){}})();
var DL=['Di','Lu','Ma','Me','Je','Ve','Sa'],DN=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function show(w){$('home').classList.toggle('off',w!=='home');$('setup').classList.toggle('off',w!=='setup')}
function sessTotal(s){var o=cfg,t=0;s.blocks.forEach(function(B){cfg=B;t+=total()});cfg=o;return t}
function sum(s){var n=0,r=false;s.blocks.forEach(function(B){n+=B.ex.length;if(B.ex.some(function(e){return e.m==='r'}))r=true});return n+' exercice'+(n>1?'s':'')+(s.blocks.length>1?' · '+s.blocks.length+' blocs':'')+' · '+(r?'≥ ':'')+Math.round(sessTotal(s)/60)+' min'}
function sCard(s,hl){var c=mk('div',hl?'card hl':'card');c.appendChild(mk('b','',s.name||'Séance'));c.appendChild(mk('small','lbl',sum(s)));
var ds=[1,2,3,4,5,6,0].filter(function(d){return s.days.indexOf(d)>-1}).map(function(d){return DL[d]}).join(' · ');c.appendChild(mk('small','lbl',ds||'Non planifiée'));
var a=mk('div','acts'),g=mk('button','btn','Démarrer'),m=mk('button','btn alt','Modifier');
g.onclick=function(){runS=s;origin='home';$('go').onclick()};m.onclick=function(){openS(s)};a.appendChild(g);a.appendChild(m);c.appendChild(a);return c}
function renderHome(){var td=new Date().getDay(),T=$('today'),hr=new Date().getHours(),wc=weekCount();$('hero').innerHTML=logo('currentColor','var(--bg)');$('hello').textContent=hr<12?'Bonjour !':hr<18?'Bon après-midi !':'Bonsoir !';$('phrase').textContent=PH[Math.floor(Date.now()/864e5)%PH.length];$('week').textContent=wc+' séance'+(wc>1?'s':'')+' cette semaine';T.innerHTML='';T.appendChild(mk('h2','','Aujourd’hui · '+DN[td]));
var pl=store.sessions.filter(function(s){return s.days.indexOf(td)>-1});
if(!pl.length)T.appendChild(mk('p','lbl','Rien de prévu. Planifie une séance (bouton Modifier) ou lance-en une ci-dessous.'));
pl.forEach(function(s){T.appendChild(sCard(s,true))});
var L=$('slist');L.innerHTML='';store.sessions.forEach(function(s){L.appendChild(sCard(s,false))})}
function drawDays(){var D=$('days');D.innerHTML='';[1,2,3,4,5,6,0].forEach(function(d){var on=cur.days.indexOf(d)>-1,b=mk('button',on?'on':'',DL[d]);b.setAttribute('aria-pressed',on);
b.onclick=function(){var i=cur.days.indexOf(d);if(i>-1)cur.days.splice(i,1);else cur.days.push(d);save();drawDays()};D.appendChild(b)})}
function openS(s){cur=s;curB=0;cfg=s.blocks[0];origin='setup';$('sname').value=s.name||'';$('del').style.display=store.sessions.length>1?'':'none';$('del').textContent='Supprimer cette séance';delArm=false;draw();drawDays();show('setup');window.scrollTo(0,0)}
$('sname').oninput=function(){cur.name=this.value;save()};
$('back').onclick=function(){show('home');renderHome()};
$('newS').onclick=function(){var s={id:Date.now(),name:'Nouvelle séance',days:[],blocks:[{prep:10,gap:30,mode:'ex',circ:3,ex:[{n:'Exercice 1',w:40,r:20,k:3,m:'t',q:10}]}]};store.sessions.push(s);save();openS(s)};
$('dup').onclick=function(){var c=JSON.parse(JSON.stringify(cur));c.id=Date.now();c.name=(cur.name||'Séance')+' (copie)';c.days=[];store.sessions.push(c);save();openS(c)};
$('del').onclick=function(){if(!delArm){delArm=true;$('del').textContent='Touche encore pour confirmer';return}store.sessions.splice(store.sessions.indexOf(cur),1);save();show('home');renderHome()};
function drawBlocks(){var D=$('blocks');D.innerHTML='';
cur.blocks.forEach(function(B,i){var b=mk('button',i===curB?'on':'',B.name||('Bloc '+(i+1)));b.onclick=function(){curB=i;cfg=B;draw()};D.appendChild(b)});
var a=mk('button','','+ Bloc');a.onclick=function(){var B={name:'',prep:30,gap:30,mode:'circ',circ:3,ex:[{n:'Exercice 1',w:40,r:20,k:3,m:'t',q:10}]};cur.blocks.push(B);curB=cur.blocks.length-1;cfg=B;save();draw()};D.appendChild(a);
$('bname').value=cfg.name||'';$('bdel').style.display=cur.blocks.length>1?'':'none';$('bdel').textContent='Supprimer ce bloc';bArm=false;
$('pl-l').textContent=curB?'Pause avant ce bloc':'Préparation';$('pl-s').textContent=curB?'après le bloc précédent':'avant le premier exercice'}
var bArm=false;
$('bname').oninput=function(){cfg.name=this.value;save()};$('bname').onchange=function(){draw()};
$('bdel').onclick=function(){if(!bArm){bArm=true;$('bdel').textContent='Touche encore pour confirmer';return}bArm=false;cur.blocks.splice(curB,1);curB=Math.max(0,curB-1);cfg=cur.blocks[curB];save();draw()};
var goRun=$('go').onclick;$('go').onclick=function(){if(origin==='setup')runS=cur;goRun()};


document.addEventListener('visibilitychange',function(){if(!document.hidden&&timer&&!paused)lock()});
renderHome();
</script>
</body>
</html>
